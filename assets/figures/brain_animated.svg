<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#7C4DFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A0E27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081">
        <animate attributeName="stop-color" 
                 values="#FF4081;#7C4DFF;#00E5FF;#FF4081" 
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C4DFF">
        <animate attributeName="stop-color" 
                 values="#7C4DFF;#00E5FF;#FF4081;#7C4DFF" 
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="250" cy="250" r="230" fill="url(#glow)">
    <animate attributeName="r" values="220;250;220" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#00E5FF" 
          stroke-width="1" stroke-dasharray="4,12" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" 
                      from="0 250 250" to="360 250 250" dur="25s" repeatCount="indefinite"/>
  </circle>

  <!-- Brain outline with pulse -->
  <g filter="url(#blur)">
    <path d="M 115 260 Q 80 210 95 155 Q 115 105 175 90 Q 215 80 240 110 
             Q 250 130 245 165 Q 245 210 240 250 Q 230 300 200 330 
             Q 160 350 135 330 Q 115 310 115 260 Z"
          fill="url(#brainGrad)" opacity="0.85" stroke="#00E5FF" stroke-width="2">
      <animate attributeName="opacity" values="0.7;0.95;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 385 260 Q 420 210 405 155 Q 385 105 325 90 Q 285 80 260 110 
             Q 250 130 255 165 Q 255 210 260 250 Q 270 300 300 330 
             Q 340 350 365 330 Q 385 310 385 260 Z"
          fill="url(#brainGrad)" opacity="0.85" stroke="#FF4081" stroke-width="2">
      <animate attributeName="opacity" values="0.95;0.7;0.95" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Corpus callosum -->
    <ellipse cx="250" cy="215" rx="65" ry="45" fill="#FFB74D" opacity="0.3"/>
  </g>

  <!-- Brain stem -->
  <path d="M 235 335 Q 230 375 240 405 Q 250 415 260 405 Q 270 375 265 335 Z"
        fill="url(#brainGrad)" stroke="#00E5FF" stroke-width="2" opacity="0.8"/>

  <!-- Glowing neurons (pulsing dots) -->
  <g>
    <circle cx="160" cy="180" r="6" fill="#00E5FF">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="150" r="5" fill="#FFB74D">
      <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="150" r="5" fill="#00E5FF">
      <animate attributeName="r" values="3;7;3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="180" r="6" fill="#FF4081">
      <animate attributeName="r" values="4;9;4" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="175" cy="260" r="5" fill="#7C4DFF">
      <animate attributeName="r" values="3;8;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="325" cy="260" r="5" fill="#7C4DFF">
      <animate attributeName="r" values="3;8;3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="220" r="7" fill="#FFB74D">
      <animate attributeName="r" values="5;10;5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Neural connections -->
  <g stroke="#00E5FF" stroke-width="0.8" opacity="0.3" fill="none">
    <path d="M 160 180 Q 210 165 210 150">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 290 150 Q 320 165 340 180">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 175 260 Q 215 245 250 220">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 325 260 Q 285 245 250 220">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
